# Pushing a version tag publishes the package to pub.dev.
#
#   git tag v1.3.0 && git push origin v1.3.0
#
# Authentication is OIDC — no token lives in this repo. Enable automated
# publishing once on pub.dev (flutter_validators → Admin → Automated publishing)
# for StacDev/flutter_validators with the tag pattern `v{{version}}`.
# The `version` in pubspec.yaml must match the tag (v1.3.0 → 1.3.0).
name: Publish

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

jobs:
  pana:
    name: Pana score gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - run: dart pub get --no-example

      - name: Require a perfect score
        run: |
          dart pub global activate pana
          dart pub global run pana --no-warning --json . > pana.json
          granted=$(jq -r '.scores.grantedPoints' pana.json)
          max=$(jq -r '.scores.maxPoints' pana.json)
          echo "pana: $granted / $max"
          if [ "$granted" != "$max" ]; then
            echo "Points were dropped in these sections:"
            jq -r '.report.sections[]
                   | select(.grantedPoints < .maxPoints)
                   | "--- \(.title) (\(.grantedPoints)/\(.maxPoints))\n\(.summary)"' \
              pana.json
            exit 1
          fi

  package:
    needs: pana
    permissions:
      id-token: write # Required to mint the OIDC token pub.dev verifies.
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
